<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" role="img" aria-label="SHOS colour roles">
  <rect width="920" height="620" fill="#F0F0F3"/>
  <text x="32" y="44" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#1B1B1F">Colour roles</text>
  <text x="32" y="70" font-family="Inter, sans-serif" font-size="12" fill="#5B5B62">Source of truth: src/calculations/designTokens.js. Swatches are illustrative.</text>

  <text x="32" y="108" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1B1B1F">NEUTRAL (light)</text>
  <g font-family="Inter, sans-serif" font-size="11">
    <rect x="32" y="122" width="90" height="42" rx="8" fill="#F0F0F3" stroke="#DCDCE1"/><text x="40" y="148" fill="#1B1B1F">bg</text>
    <rect x="132" y="122" width="90" height="42" rx="8" fill="#FFFFFF" stroke="#DCDCE1"/><text x="140" y="148" fill="#1B1B1F">surface</text>
    <rect x="232" y="122" width="110" height="42" rx="8" fill="#E7E7EB" stroke="#DCDCE1"/><text x="240" y="148" fill="#1B1B1F">surfaceVariant</text>
    <rect x="352" y="122" width="90" height="42" rx="8" fill="#DCDCE1" stroke="#DCDCE1"/><text x="360" y="148" fill="#1B1B1F">border</text>
    <rect x="452" y="122" width="100" height="42" rx="8" fill="#1B1B1F"/><text x="460" y="148" fill="#FFFFFF">textPrimary</text>
    <rect x="562" y="122" width="100" height="42" rx="8" fill="#5B5B62"/><text x="570" y="148" fill="#FFFFFF">textSecondary</text>
    <rect x="672" y="122" width="100" height="42" rx="8" fill="#656568"/><text x="680" y="148" fill="#FFFFFF">textDisabled</text>
  </g>

  <text x="32" y="198" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1B1B1F">NEUTRAL_DARK</text>
  <g font-family="Inter, sans-serif" font-size="11">
    <rect x="32" y="212" width="90" height="42" rx="8" fill="#121214" stroke="#3A3A3F"/><text x="40" y="238" fill="#F2F2F4">bg</text>
    <rect x="132" y="212" width="90" height="42" rx="8" fill="#1C1C1F" stroke="#3A3A3F"/><text x="140" y="238" fill="#F2F2F4">surface</text>
    <rect x="232" y="212" width="110" height="42" rx="8" fill="#26262A" stroke="#3A3A3F"/><text x="240" y="238" fill="#F2F2F4">surfaceVariant</text>
    <rect x="352" y="212" width="90" height="42" rx="8" fill="#3A3A3F" stroke="#3A3A3F"/><text x="360" y="238" fill="#F2F2F4">border</text>
    <rect x="452" y="212" width="100" height="42" rx="8" fill="#F2F2F4"/><text x="460" y="238" fill="#121214">textPrimary</text>
    <rect x="562" y="212" width="100" height="42" rx="8" fill="#B8B8BE"/><text x="570" y="238" fill="#121214">textSecondary</text>
    <rect x="672" y="212" width="100" height="42" rx="8" fill="#89898C"/><text x="680" y="238" fill="#121214">textDisabled</text>
  </g>

  <text x="32" y="288" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1B1B1F">Module accents (default values; user-overridable)</text>
  <g font-family="Inter, sans-serif" font-size="11">
    <rect x="32" y="302" width="92" height="34" rx="17" fill="#B36205"/><text x="44" y="324" fill="#FFFFFF">contacts</text>
    <rect x="134" y="302" width="104" height="34" rx="17" fill="#7F30A6"/><text x="146" y="324" fill="#FFFFFF">encounters</text>
    <rect x="248" y="302" width="104" height="34" rx="17" fill="#003B6F"/><text x="260" y="324" fill="#FFFFFF">medication</text>
    <rect x="362" y="302" width="104" height="34" rx="17" fill="#09582E"/><text x="374" y="324" fill="#FFFFFF">healthcare</text>
    <rect x="476" y="302" width="76" height="34" rx="17" fill="#008585"/><text x="488" y="324" fill="#FFFFFF">home</text>
    <rect x="562" y="302" width="104" height="34" rx="17" fill="#EB4799"/><text x="574" y="324" fill="#FFFFFF">menstrual</text>
    <rect x="676" y="302" width="68" height="34" rx="17" fill="#E5484D"/><text x="688" y="324" fill="#FFFFFF">kink</text>
    <rect x="754" y="302" width="104" height="34" rx="17" fill="#E24E9C"/><text x="766" y="324" fill="#FFFFFF">protection</text>
  </g>

  <text x="32" y="372" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1B1B1F">Action and status colours</text>
  <g font-family="Inter, sans-serif" font-size="11">
    <rect x="32" y="386" width="110" height="34" rx="17" fill="#D93838"/><text x="44" y="408" fill="#FFFFFF">action.red</text>
    <rect x="152" y="386" width="110" height="34" rx="17" fill="#148A1E"/><text x="164" y="408" fill="#FFFFFF">action.green</text>
    <rect x="272" y="386" width="110" height="34" rx="17" fill="#F59E0B"/><text x="284" y="408" fill="#1B1B1F">action.amber</text>
    <rect x="392" y="386" width="110" height="34" rx="17" fill="#7A6500"/><text x="404" y="408" fill="#FFFFFF">action.gold</text>
  </g>

  <text x="32" y="456" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1B1B1F">Safe text-on-self-tint variants</text>
  <text x="32" y="478" font-family="Inter, sans-serif" font-size="11" fill="#5B5B62">Use these only where an accent is literally text on its own tinted background.</text>
  <g font-family="Inter, sans-serif" font-size="11">
    <rect x="32" y="492" width="130" height="34" rx="17" fill="#9A6700"/><text x="44" y="514" fill="#FFFFFF">contacts safe text</text>
    <rect x="172" y="492" width="110" height="34" rx="17" fill="#926100"/><text x="184" y="514" fill="#FFFFFF">home safe text</text>
    <rect x="292" y="492" width="110" height="34" rx="17" fill="#B33370"/><text x="304" y="514" fill="#FFFFFF">menstrual safe text</text>
    <rect x="412" y="492" width="120" height="34" rx="17" fill="#B53434"/><text x="424" y="514" fill="#FFFFFF">action.red safe text</text>
    <rect x="542" y="492" width="130" height="34" rx="17" fill="#146818"/><text x="554" y="514" fill="#FFFFFF">action.green safe text</text>
  </g>

  <text x="32" y="560" font-family="Inter, sans-serif" font-size="11" fill="#5B5B62">Rules: module accents identify modules; action colours carry status; red/green are semantic and must not be repurposed.</text>
  <text x="32" y="580" font-family="Inter, sans-serif" font-size="11" fill="#5B5B62">Dark mode: resolve module accents with resolveDarkAccent where a hand-picked companion exists.</text>
</svg>