name: SHOS Web Alpha

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # FIXED 30 Sep 2026 (audit) — was 20, while smoke-test.yml and
          # build-apk.yml both use 22. smoke-test.yml's own comment records
          # that this exact inconsistency was once fixed and this file was
          # missed. 22 is the version @capacitor/cli 8.x hard-requires, so
          # the web build was the only artifact produced on a Node the rest
          # of the project has already moved off.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ADDED 30 Sep 2026 (audit) — see the matching step in build-apk.yml for
      # the full finding. Short version: this workflow deployed to GitHub Pages
      # with no test, no lint and no build verification, so a red smoke-test
      # run still published the web build. `needs:` cannot span workflows, so
      # the gate has to live inside the publishing workflow. Push-only, so a
      # manual dispatch is never blocked by a gate it didn't need.
      - name: Gate (build, lint, unit tests, encoding, docs)
        if: github.event_name == 'push'
        run: npm run verify:fast

      - name: Build web app
        run: npm run build -- --base=/SHOS-V2/

      - name: Upload web build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
