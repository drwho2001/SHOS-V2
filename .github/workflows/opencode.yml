name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # ADDED 30 Sep 2026 (audit) — the author restriction below is the half that
    # matters most here, and the comment explaining it deliberately sits OUTSIDE
    # the `if` block rather than inside it. Inside a YAML block scalar (`if: |`)
    # a `#` is LITERAL TEXT, not a comment, so the first version of this put its
    # own explanation inside the expression and the workflow failed to load at
    # all. It is worth recording that the guard in
    # src/ciWorkflowGuards.test.js did not catch it: the file is perfectly valid
    # YAML, and that guard asserts the file parses. YAML validity and GitHub
    # Actions expression validity are different things, and only the second one
    # matters. The guard now checks for a `#` inside any `if:` block.
    #
    # On the threat: this repo is PUBLIC, so "anybody who can post a comment" is
    # anybody on the internet, and this job holds a live OPENCODE_API_KEY.
    # Without the restriction a stranger could post "/oc" on any issue and have
    # the owner's key spent on their prompt. Single-owner project, so restricting
    # it to the owner costs nothing real.
    if: |
      (contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode'))
      &&
      github.event.comment.user.login == 'drwho2001'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        # FIXED 30 Sep 2026 (audit) — was `anomalyco/opencode/github@latest`.
        # `latest` is a mutable tag: the upstream owner can repoint it at any
        # code at any time with no change, no review and no commit to this
        # repository, and whatever it points at runs with the API key above.
        # Third-party AND secret-bearing is the combination that makes this
        # worth pinning rather than noting.
        #
        # The SHA below was resolved from the live GitHub API (2026-03-25,
        # "chore: remove dead code for todoread tool"), not written from
        # memory — an invented SHA fails the workflow immediately and an
        # invented-but-plausible one is worse. Bumping it is a deliberate,
        # reviewable one-line change; that is the point.
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a # latest as of 2026-03-25
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle