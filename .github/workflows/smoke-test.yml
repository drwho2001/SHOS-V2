name: SHOS Smoke Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# ADDED 4 Sep 2026 — real gap named directly in CLAUDE.md's own Known
# Issues: "Near-zero automated test coverage. One manual, non-CI
# Playwright script (3 flows)... very likely why a real, four-
# subsystem-breaking bug shipped silently for weeks before live
# device debugging caught it." This wires the SAME script, unmodified,
# into a real CI gate: every push to main now gets it run for real, not
# "run it if you remember to."
#
# REWRITTEN 28 Sep 2026 — this job used to hand-copy each gate:
# `npm run lint`, `npm run check:encoding`, `npm run test`, `npm run
# build`, then `node scripts/smoke-test.cjs`. That is the exact shape of
# problem docs/CHANGE-PROCEDURE.md exists to prevent: two lists of "the
# checks" that drift apart the moment one of them changes. Changing a gate
# locally would not have changed CI, and nothing would have said so.
#
# It now runs `npm run verify` — the SAME script a developer runs before
# committing. One list of checks, one implementation, and a gate that
# cannot disagree with the procedure it documents. Concretely, that means:
#
#   - adding a gate to verify-changes.mjs adds it to CI, automatically
#   - the smoke suite runs against a preview server the script starts and
#     cleans up itself, on a generated port, instead of a hardcoded 5183
#     that silently conflicts with a leftover local server
#   - fixing the leak/orphaned-browser problems in the local runner fixes
#     the CI runner at the same time
#
# A portability bug this immediately exposed: the local runner polled the
# server with `curl -o NUL`, which is a WINDOWS null device. On Linux curl
# would have created a real file called `NUL` in the repo root. It could
# never have been caught locally, because locally the script only ever ran
# on Windows. Now a portable Node HTTP probe instead. This is the concrete
# argument for the two being one command: sharing code across platforms
# surfaces portability bugs that splitting hides.
jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
        with:
          # REQUIRED by the docs gate, not an optimisation.
          #
          # actions/checkout defaults to fetch-depth: 1, i.e. exactly one
          # commit and no history. The docs gate diffs the pushed commit RANGE
          # (`before..after`), so with a shallow clone that range cannot be
          # resolved, the diff returns nothing, and the gate reports "no source
          # changes" — passing while checking absolutely nothing.
          #
          # This is the second time this gate has passed vacuously, and both
          # times it looked green. The first was a working-tree diff in CI
          # (always empty); this one is a shallow clone. Neither is a logic
          # error, both are "the thing I was measuring wasn't there" - so the
          # verification is to read the gate's own reported verdict in the CI
          # log, not merely its exit code.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # CHANGED — real inconsistency flagged in a relayed AI review:
          # build-apk.yml already runs Node 22 (a hard requirement there —
          # @capacitor/cli 8.x refuses to run on anything older). This job
          # doesn't touch Capacitor and had been passing fine on 20, but
          # there's no reason to run CI on two different Node versions for
          # the same repo when nothing depends on staying on 20.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # scripts/smoke-test.cjs's own header notes this repo doesn't
      # depend on playwright directly (a dev-machine convenience, not
      # meant to bloat every real install) — installed here, in CI
      # only, the same way a developer running the script by hand
      # already has to. `--with-deps` pulls the system libraries Chromium
      # needs, which is the part that actually differs on ubuntu-latest.
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      # The whole gate, in one command. Runs in order: build -> lint ->
      # unit tests -> encoding guard -> smoke suite -> docs check, and
      # prints one pass/fail table. The docs gate needs to know what this
      # push changed, and by CI time the change is committed, so it diffs
      # the pushed RANGE rather than a working tree that is always clean.
      #
      # `npm ci` above is the only setup step that must precede it: the
      # script deliberately does not install Playwright itself, because
      # doing so as a side effect of a verification command would be
      # surprising and slow.
      - name: Full gate (build, lint, tests, encoding, smoke, docs)
        run: npm run verify
        env:
          DOCS_BASE_REF: ${{ github.event.before }}
          # Make the free-RAM annotation meaningful if this ever runs on a
          # smaller runner. Harmless where there is plenty.
          CI: "true"
