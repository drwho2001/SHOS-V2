name: SHOS Smoke Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# ADDED 4 Sep 2026 — real gap named directly in CLAUDE.md's own Known
# Issues: "Near-zero automated test coverage. One manual, non-CI
# Playwright script (3 flows)... very likely why a real, four-
# subsystem-breaking bug shipped silently for weeks before live
# device debugging caught it." scripts/smoke-test.cjs already exists
# and already proved useful catching real regressions this session —
# it just never ran anywhere except a developer's own terminal. This
# wires the SAME script, unmodified, into a real CI gate: every push
# to main now gets it run for real, not "run it if you remember to."
jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # CHANGED — real inconsistency flagged in a relayed AI review:
          # build-apk.yml already runs Node 22 (a hard requirement there —
          # @capacitor/cli 8.x refuses to run on anything older). This job
          # doesn't touch Capacitor and had been passing fine on 20, but
          # there's no reason to run CI on two different Node versions for
          # the same repo when nothing depends on staying on 20.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ADDED 10 Sep 2026 — real ask: "smoke lint type check... do it if
      # needed." Runs first, fails fast (before the heavier Playwright
      # install/build steps) — ESLint already found and helped fix 5 real
      # bugs the day it was added (a missing import that would crash a
      # screen on first use, a stale-closure search-filter bug, two
      # dead-memoization constants, and a Home dashboard section that
      # could silently never populate). `npm run typecheck` (tsc
      # --checkJs) deliberately NOT run here — see tsconfig.json's own
      # header for why it's a real diagnostic tool but not a clean gate
      # on this specific untyped JS/JSX codebase today.
      - name: Lint
        run: npm run lint

      # ADDED 25 Sep 2026 — a real, committed encoding-corruption bug got
      # through every other gate in this file. CLAUDE.md (this repo's own
      # source-of-truth doc) and SHOS_Vaccinations_Prototype.jsx both
      # contained ~1,800 genuine mojibake characters, because original UTF-8
      # bytes had been read as CP1252 and re-encoded as UTF-8. Lint, vitest,
      # the build and all 15 smoke flows passed throughout, because they
      # check BEHAVIOUR, not bytes — nothing in the repo could have caught
      # it. This guard scans every git-tracked text file for the mojibake
      # signatures and the C1-control-character fingerprint of a lossy
      # encoding round-trip. It is deliberately tested against injected
      # corruption rather than merely run once green: its first two
      # versions each produced false positives on a clean repo (unpaired
      # emoji surrogates, and a legitimately UTF-16 PowerShell manifest),
      # and its first lead-character range missed the single most common
      # sequence of all ("â" + "€") because U+20AC is outside 0x80-0xFF.
      - name: Encoding guard (mojibake)
        run: npm run check:encoding

      - name: Unit tests (Vitest)
        run: npm run test

      # scripts/smoke-test.cjs's own header notes this repo doesn't
      # depend on playwright directly (a dev-machine convenience, not
      # meant to bloat every real install) — installed here, in CI
      # only, the same way a developer running the script by hand
      # already has to.
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Build web app
        run: npm run build

      # `vite preview` serves the real production build (dist/), a
      # closer match to what actually ships than the dev server the
      # script's own header instructions use for local runs.
      - name: Start preview server
        run: nohup npx vite preview --port 5183 --strictPort > preview.log 2>&1 &

      - name: Wait for the preview server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5183 -o /dev/null; then
              echo "Preview server is up."
              exit 0
            fi
            sleep 1
          done
          echo "Preview server did not come up in time. Log:"
          cat preview.log
          exit 1

      - name: Run smoke test
        run: node scripts/smoke-test.cjs
        env:
          SMOKE_TEST_URL: http://localhost:5183
