name: Build Android APK

on:
  push:
    branches: [ main ]
  # ADDED — real ask: bisecting a real device crash by installing old
  # builds directly, rather than guessing from code alone. checkout_sha
  # lets a manually-dispatched run build a SPECIFIC historical commit
  # while still using the CURRENT workflow file (workflow_dispatch always
  # reads the workflow definition from the ref that trigger it, which
  # stays `main`/HEAD here — only the actual source checked out inside
  # the job changes) -- so old commits' own frozen workflow.yml (which
  # only knows how to publish to "latest") never has to be touched.
  # release_tag lets that same run publish to its OWN release instead of
  # overwriting "latest" (the one build meant for real day-to-day
  # testing) -- defaults to "latest" so a plain manual re-run without
  # inputs behaves exactly as before.
  workflow_dispatch:
    inputs:
      checkout_sha:
        description: "Commit SHA to build (blank = current HEAD)"
        required: false
        default: ""
      release_tag:
        description: "Release tag to publish to (blank = latest)"
        required: false
        default: ""

permissions:
  contents: write

# ADDED 29 Sep 2026 after observing a real failure, not a hypothetical one.
#
# This job does `git push origin latest --force` so that `git checkout latest`
# hands out current code rather than whatever the tag happened to be set to -
# the original reason the step exists, when the tag was found frozen 3 weeks
# behind while the release body kept updating correctly. That force-push is the
# one part of this workflow that is NOT concurrency-safe, and two sessions
# pushing minutes apart reliably breaks it: the later run has its tag ref
# rejected and the job dies at that step, BEFORE the release is published. So
# the newer commit gets no APK at all, and the previously-published asset stays
# up looking current.
#
# Measured, not predicted: on 29 Sep two runs started 3 minutes apart
# (3209e42, then efe4200 on top of it) and the second one failed with
# "error: failed to push some refs" at "Force-update the release tag". This
# project pushes from two sessions routinely, so the collision is the normal
# case rather than the edge one.
#
# `cancel-in-progress: false` is deliberate and is the whole point. Cancelling
# would reintroduce the exact bug above - a cancelled run leaves the tag and the
# asset describing different commits. Queueing instead means the second run
# waits, then tags and publishes the newer commit, which is the state we want.
concurrency:
  group: build-apk-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.checkout_sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # @capacitor/cli 8.x requires Node >=22 (confirmed via the actual
          # CI failure: "[fatal] The Capacitor CLI requires NodeJS >=22.0.0").
          # Node 20 was in the original template but is incompatible.
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        # FIXED 30 Sep 2026 (audit) — was `npm install`, which re-resolves
        # within semver ranges. Combined with the fact that this workflow ran
        # no tests at all, that meant the APK published to a public release
        # could be built from a dependency tree nobody had verified. npm ci
        # installs exactly the lockfile. smoke-test.yml and web-alpha.yml
        # already used npm ci; this was the odd one out.
        run: npm ci

      # ADDED 30 Sep 2026 (audit) — THE gate this workflow never had.
      #
      # THE FINDING: build-apk.yml runs on every push to main and performed no
      # test, no lint and no build verification of any kind — it went straight
      # from npm install to gradle to a PUBLIC release. smoke-test.yml is the
      # one gated workflow, and the natural conclusion ("it must be covered")
      # was wrong in a way worth stating: `needs:` works only BETWEEN JOBS in
      # the same workflow, so one workflow can never depend on another. Making
      # this gate real means putting the gate INSIDE the publishing workflow.
      #
      # `verify:fast` rather than the full `verify` on purpose: it is build,
      # lint, unit tests, encoding guard and the docs check — the things that
      # would actually produce a broken APK — and it takes ~2 minutes instead
      # of ~12. The full 23-flow Playwright suite still runs in smoke-test.yml,
      # so running it a second time here would double CI time to re-derive a
      # verdict rather than add coverage. What this gate does NOT cover is
      # stated here rather than left to look comprehensive.
      #
      # `push` ONLY, deliberately. workflow_dispatch + checkout_sha exists so
      # the owner can bisect a real device crash by building OLD commits
      # against the CURRENT workflow file. Gating those would run today's tests
      # against last month's source, which fails by construction and would
      # break the bisect feature outright. A manual bisect build is also
      # explicitly not something to publish over `latest`.
      - name: Gate (build, lint, unit tests, encoding, docs)
        if: github.event_name == 'push'
        run: npm run verify:fast

      - name: Build the web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: SHOS-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Publishes the same APK to a GitHub Release so it has a stable,
      # login-free download link (unlike workflow artifacts, which require
      # a GitHub account) -- for sharing test builds with friends.
      - name: Rename APK for the release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SHOS-debug.apk

      # FIXED — real bug found 16 Sep 2026: softprops/action-gh-release
      # updates an existing release's body/assets in place but never
      # moves the underlying git tag if it already exists — so `latest`
      # sat frozen at its original 27 Aug creation commit for weeks while
      # the release notes/APK kept silently updating to newer commits.
      # Force-moving the tag to the exact commit just checked out (not
      # just github.sha, so a workflow_dispatch checkout_sha build tags
      # correctly too) keeps `git checkout latest` honest with what the
      # release page actually claims.
      - name: Force-update the release tag to this commit
        env:
          # FIXED 30 Sep 2026 (audit) — moved out of the shell body. GitHub
          # expands `${{ }}` BEFORE the shell runs, so interpolating the input
          # directly put attacker-controllable text inside a command that runs
          # with `contents: write` and force-pushes a tag. Passing it through
          # `env:` makes it a variable the shell expands as data, so quotes or
          # `$(...)` in the value are inert. Exploiting the old form needed
          # workflow_dispatch rights, so severity was capped — but this job
          # holds write access to the repository and there was no reason to
          # leave the injection path open.
          RELEASE_TAG: ${{ github.event.inputs.release_tag || 'latest' }}
        run: |
          git tag -f "$RELEASE_TAG"
          git push origin "$RELEASE_TAG" --force

      - name: Publish APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'latest' }}
          name: "${{ github.event.inputs.release_tag && format('SHOS (test build: {0})', github.event.inputs.release_tag) || 'SHOS (latest build)' }}"
          body: |
            Automated debug build from commit ${{ github.event.inputs.checkout_sha || github.sha }}.
            This is a debug APK for testing/feedback -- not a production release.

            Install: download SHOS-debug.apk below, then on your Android phone allow
            "install from unknown sources" for your browser/file manager when prompted.
          files: SHOS-debug.apk
