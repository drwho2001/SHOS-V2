name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # @capacitor/cli 8.x requires Node >=22 (confirmed via the actual
          # CI failure: "[fatal] The Capacitor CLI requires NodeJS >=22.0.0").
          # Node 20 was in the original template but is incompatible.
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build the web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHOS-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Publishes the same APK to a GitHub Release so it has a stable,
      # login-free download link (unlike workflow artifacts, which require
      # a GitHub account) -- for sharing test builds with friends.
      - name: Rename APK for the release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SHOS-debug.apk

      - name: Publish APK to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SHOS (latest build)
          body: |
            Automated debug build from the latest push to `main` (commit ${{ github.sha }}).
            This is a debug APK for testing/feedback -- not a production release.

            Install: download SHOS-debug.apk below, then on your Android phone allow
            "install from unknown sources" for your browser/file manager when prompted.
          files: SHOS-debug.apk
